name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter versions
        run: |
          bash --version | head -1
          python3 --version
          openssl version
          curl --version | head -1

      - name: Syntax check
        run: |
          bash -n security-audit.sh
          bash -n tests/run-tests.sh
          bash -n tests/stubs/curl

      - name: Run test suite
        run: ./tests/run-tests.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Lint
        run: shellcheck --severity=warning security-audit.sh tests/run-tests.sh tests/stubs/curl
